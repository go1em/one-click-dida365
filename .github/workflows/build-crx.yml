name: Build CRX

on:
  push:
    branches: [ dida ]  # 修改为你的主分支名称
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install crx3
        run: npm install -g crx3

      - name: Build CRX
        env:
          PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          # 创建输出目录
          mkdir -p dist
          
          # 使用 crx3 工具打包扩展（注意：源目录改为 src/）
          crx3 --key <(echo "$PRIVATE_KEY") -o dist/oneclickdida.crx src/
          
          # 验证文件是否生成
          if [ -f dist/oneclickdida.crx ]; then
            echo "CRX 打包成功!"
          else
            echo "CRX 打包失败!"
            exit 1
          fi

      - name: Upload CRX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneclickdida-crx
          path: dist/oneclickdida.crx